version: '3.8'

services:
  auth-service:
    build: ./auth-service
    ports:
      - "5000:5000"

  order-service:
    build: ./order-service
    ports:
      - "5001:5001"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - auth-service
      - order-service

  db:
    image: postgres:13
    environment:
      POSTGRES_DB: microdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  backup:
    build:
      context: ./backup
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backup:/backups

volumes:
  db_data:
